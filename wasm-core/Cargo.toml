[package]
name = "wasm-core"
version = "0.1.0"
edition = "2021"
description = "Motor gráfico WebAssembly em Rust para cinemática 3D, VFX e exportação glTF 2.0 + Blender Python"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"
serde_json = "1.0"
glam = { version = "0.29", features = ["serde"] }

[profile.release]
opt-level = "s"
lto = true
